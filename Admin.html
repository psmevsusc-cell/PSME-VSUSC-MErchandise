<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSME Admin - Order Management</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 0.9rem; }
    th { background: #003366; color: white; }
    .btn { padding: 6px 12px; background: #003366; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn-danger { background: #dc3545; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
    .badge-Pending { background: #fff3cd; color: #856404; }
    .badge-Completed { background: #d4edda; color: #155724; }
  </style>
</head>
<body>
  <div class="container">
    <h2>PSME Store Admin Portal</h2>

    <!-- Login Form -->
    <div id="login-section" class="card">
      <h3>Admin Login</h3>
      <form id="admin-login-form">
        <input type="email" id="admin-email" placeholder="Email" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
        <input type="password" id="admin-password" placeholder="Password" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
        <button type="submit" class="btn">Log In</button>
      </form>
      <p id="login-error" style="color: red; margin-top: 10px; display: none;"></p>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="card" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Orders Dashboard</h3>
        <button id="logout-btn" class="btn btn-danger">Log Out</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Order #</th>
            <th>Student Name</th>
            <th>Student ID</th>
            <th>Total</th>
            <th>Status</th>
            <th>Proof</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="orders-table-body">
          <tr><td colspan="7">Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
